[workspace]
members = ["service/front", "service/server", "sim"]
default-members = ["service/front", "service/server"]
resolver = "3"

[workspace.package]
version = "0.2.0"
authors = ["Angelos Drossos"]
edition = "2024"

[workspace.dependencies]
axum = { version = "0.8.4" }
axum-macros = { version = "0.5.0" }
chrono = { version = "0.4.24" }
clap = { version = "4.2.5", features = ["derive"] }
leptos = { version = "0.8.5", default-features = false }
leptos_meta = { version = "0.8.5", default-features = false }
leptos_router = { version = "0.8.5", default-features = false }
leptos_dom = { version = "0.8.5", default-features = false }
leptos_axum = { version = "0.8.5" }
serde = { version = "1" }
thiserror = { version = "2.0" }
tokio = { version = "1", features = ["full"] }
tracing = { version = "0.1.37" }
tracing-subscriber = { version = "0.3.17", features = ["env-filter"] }

[[workspace.metadata.leptos]]
name = "refuel"
bin-package = "refuel-server"
lib-package = "refuel-front"
assets-dir = "service/assets"
style-file = "service/css/main.scss"
site-root = "target/site/refuel"
